name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend CI ────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ... (Keep your Postgres/Redis services here as they were)
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://predictora:testpassword@localhost:5432/predictora_test
          REDIS_URL: redis://localhost:6379

  # ── Android CI ───────────────────────────────────────
  android-lint-test:
    name: Android — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # CRITICAL: This will fail if secrets.GOOGLE_SERVICES_JSON is empty!
      - name: Decode google-services.json
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Warning: GOOGLE_SERVICES_JSON secret is missing! Creating dummy for linting."
            echo "{}" > android/app/google-services.json
          else
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          fi

      - name: Run Android lint
        run: ./android/gradlew -p android lintDebug

  # ── Datadog Monitoring (The missing piece) ────────────
  datadog-tests:
    name: Datadog Synthetic Tests
    runs-on: ubuntu-latest
    needs: [backend-lint-test] # Only run if backend tests pass
    steps:
      - uses: actions/checkout@v4
      - name: Run Datadog Synthetics
        uses: DataDog/synthetics-ci-github-action@v1
        with:
          api_key: ${{ secrets.DATADOG_API_KEY }}
          app_key: ${{ secrets.DATADOG_APP_KEY }}
          config_path: 'datadog-config.json' # Make sure this file exists!
          
